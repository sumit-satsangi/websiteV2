[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build:static"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/start"
  to = "/.netlify/functions/auth-start"
  status = 200

[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/content/list"
  to = "/.netlify/functions/content-list"
  status = 200

[[redirects]]
  from = "/api/content/save"
  to = "/.netlify/functions/content-save"
  status = 200

[[redirects]]
  from = "/api/content/archive"
  to = "/.netlify/functions/content-archive"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
