# W10 EDITING GUIDE: Netlify runs the build command and publishes the _site folder.
# W10 TIP: Do not change the publish folder unless you also change scripts/build-w10.sh.
[build]
  command = "bash scripts/build-w10.sh"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 301

[[redirects]]
  from = "/blogs"
  to = "/blogs.html"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/podcast.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/experience"
  to = "/experience.html"
  status = 301

[[redirects]]
  from = "/impact"
  to = "/impact.html"
  status = 301

[[redirects]]
  from = "/technology"
  to = "/technology.html"
  status = 301

[[redirects]]
  from = "/leadership"
  to = "/leadership.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
